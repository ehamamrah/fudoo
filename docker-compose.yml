services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fudoo
      POSTGRES_USER: fudoo
      POSTGRES_PASSWORD: fudoo
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fudoo -d fudoo"]
      interval: 2s
      retries: 15

  be:
    build: ./fudoo-be
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://fudoo:fudoo@db:5432/fudoo
      DJANGO_DEBUG: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./fudoo-be:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 5s
      retries: 20

  fe:
    build: ./fudoo-fe
    environment:
      API_PROXY_TARGET: http://be:8000
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./fudoo-fe:/app
      - /app/node_modules
    depends_on:
      be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      retries: 20

volumes:
  pgdata18:
